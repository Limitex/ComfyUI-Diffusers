[project]
name = "ComfyUI-Diffusers"
version = "0.1.0"
description = "This repository is a custom node in ComfyUI. This is a program that allows you to use Huggingface Diffusers module with ComfyUI. Additionally, Stream Diffusion is also available."
authors = [
    {name = "Limitex",email = "76650151+Limitex@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dependency-injector (>=4.48.2,<5.0.0)",
    "diffusers[torch] (>=0.35.2,<0.36.0)",
    "torch (>=2.9.0,<3.0.0)",
    "torchaudio (>=2.9.0,<3.0.0)",
    "torchvision (>=0.24.0,<0.25.0)",
    "transformers (>=4.57.1,<5.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
]

[tool.poetry]
packages = [
    {include = "src"}
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
namespace_packages = true
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "folder_paths",
    "folder_paths.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "diffusers",
    "diffusers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "dependency_injector",
    "dependency_injector.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.2,<0.15.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "bandit[toml] (>=1.8.6,<2.0.0)",
    "import-linter (>=2.5.2,<3.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "commitizen (>=4.9.1,<5.0.0)",
]
