[mypy]
python_version = 3.10
namespace_packages = True
explicit_package_bases = True
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# ComfyUI folder_paths module
[mypy-folder_paths]
ignore_missing_imports = True

[mypy-folder_paths.*]
ignore_missing_imports = True

# Diffusers library
[mypy-diffusers]
ignore_missing_imports = True

[mypy-diffusers.*]
ignore_missing_imports = True

# Dependency Injector
[mypy-dependency_injector]
ignore_missing_imports = True

[mypy-dependency_injector.*]
ignore_missing_imports = True

# Transformers library
[mypy-transformers]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

# PyTorch
[mypy-torch]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

# TorchVision
[mypy-torchvision]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

# TorchAudio
[mypy-torchaudio]
ignore_missing_imports = True

[mypy-torchaudio.*]
ignore_missing_imports = True

# OmegaConf
[mypy-omegaconf]
ignore_missing_imports = True

[mypy-omegaconf.*]
ignore_missing_imports = True

# SafeTensors
[mypy-safetensors]
ignore_missing_imports = True

[mypy-safetensors.*]
ignore_missing_imports = True
