services:
  comfyui:
    build: 
      context: .
      dockerfile: docker/comfyui/Dockerfile
    container_name: comfyui
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - POETRY_VENV_IN_PROJECT=false
      - POETRY_NO_INTERACTION=1
      - POETRY_CACHE_DIR=/tmp/poetry_cache
    volumes:
      - ./tmp/models/checkpoints:/app/ComfyUI/models/checkpoints
      - ./tmp/models/loras:/app/ComfyUI/models/loras
      - ./tmp/models/vae:/app/ComfyUI/models/vae
      - ./tmp/output:/app/ComfyUI/output
      - ./tmp/workflows:/app/ComfyUI/user/default/workflows
      - ./tmp/tmp:/app/ComfyUI/temp
      - .:/app/ComfyUI/custom_nodes/ComfyUI-Diffusers
    ports:
      - "8188:8188"
    restart: unless-stopped
    stdin_open: true
    tty: true
  
  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    volumes:
      - .:/app
      - venv_data:/cache/.venv

volumes:
  venv_data:
